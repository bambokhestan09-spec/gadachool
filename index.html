<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEDA CHOLHA - لیگ پیش‌بینی فوتبال</title>
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #00e676;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #1f2937, #111827);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Navigation / Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        /* Sections */
        .section {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .section.active {
            display: block;
        }

        /* Leaderboard Table */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
        }

        tr:first-child td:first-child {
            color: var(--gold);
            font-weight: bold;
        }

        .rank {
            font-weight: bold;
            width: 50px;
        }

        .points {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* Matches Grid */
        .matches-grid {
            display: grid;
            gap: 15px;
        }

        .match-card {
            background: #21262d;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .team {
            font-weight: bold;
            font-size: 1.1rem;
            width: 40%;
        }

        .team.left { text-align: left; }
        .team.right { text-align: right; }

        .vs {
            background: var(--border-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 30px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>GEDA CHOLHA</h1>
            <p>جدول رسمی لیگ پیش‌بینی و کل‌کل‌های گروهی</p>
        </header>

        <!-- Navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('leaderboard')">جدول امتیازات</button>
            <button class="tab-btn" onclick="switchTab('matches')">بازی‌های این هفته</button>
        </div>

        <!-- Leaderboard Section -->
        <div id="leaderboard" class="section active">
            <table>
                <thead>
                    <tr>
                        <th>رتبه</th>
                        <th>نام شرکت‌کننده</th>
                        <th>بازی</th>
                        <th>امتیاز</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- اطلاعات به صورت پویا با جاوااسکریپت بارگذاری می‌شوند -->
                </tbody>
            </table>
        </div>

        <!-- Matches Section -->
        <div id="matches" class="section">
            <div class="matches-grid" id="matches-grid">
                <!-- بازی‌ها با جاوااسکریپت بارگذاری می‌شوند -->
            </div>
        </div>

        <footer>
            <p>© CANBO FOOTBALL | تمامی حقوق برای GEDA CHOLHA محفوظ است.</p>
        </footer>
    </div>

    <script>
        // داده‌های نمونه برای جدول امتیازات (می‌توانی تغییر دهی)
        const players = [
            { rank: 1, name: "نعیمی", played: 5, points: 42 },
            { rank: 2, name: "جاسمیان", played: 5, points: 38 },
            { rank: 3, name: "ناجح", played: 5, points: 31 },
            { rank: 4, name: "خانم داودی", played: 5, points: 27 }
        ];

        // داده‌های نمونه برای بازی‌های هفته
        const matches = [
            { home: "منچستر یونایتد", away: "لیورپول", time: "شنبه - ۲۱:۰۰" },
            { home: "رئال مادرید", away: "بارسلونا", time: "یکشنبه - ۲۲:۳۰" },
            { home: "آرسنال", away: "چلسی", time: "یکشنبه - ۱۹:۰۰" }
        ];

        // رندر جدول
        const leaderboardBody = document.getElementById('leaderboard-body');
        players.forEach(p => {
            leaderboardBody.innerHTML += `
                <tr>
                    <td class="rank">${p.rank}</td>
                    <td>${p.name}</td>
                    <td>${p.played}</td>
                    <td class="points">${p.points}</td>
                </tr>
            `;
        });

        // رندر بازی‌ها
        const matchesGrid = document.getElementById('matches-grid');
        matches.forEach(m => {
            matchesGrid.innerHTML += `
                <div class="match-card">
                    <span class="team right">${m.home}</span>
                    <span class="vs">${m.time}</span>
                    <span class="team left">${m.away}</span>
                </div>
            `;
        });

        // سوییچ بین تب‌ها
        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
